<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 345" width="800" height="345">
  <rect width="800" height="345" rx="12" fill="#191919"/>
  <text x="40" y="52" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">The three local ranking factors Google describes</text>
  <rect x="40" y="85" width="225" height="230" rx="12" fill="#1f2937" stroke="#387cf9" stroke-width="2"/><text x="60" y="128" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#387cf9">Relevance</text><text x="60" y="165" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#e5e7eb">Does your profile match</text><text x="60" y="191" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#e5e7eb">what they searched?</text><text x="60" y="250" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#9ca3af">You control:</text><text x="60" y="276" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#e5e7eb">Categories, services,</text><text x="60" y="298" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#e5e7eb">description</text>
  <rect x="285" y="85" width="225" height="230" rx="12" fill="#1f2937" stroke="#3a3a3a" stroke-width="2"/><text x="305" y="128" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#387cf9">Distance</text><text x="305" y="165" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#e5e7eb">How close are you</text><text x="305" y="191" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#e5e7eb">to the searcher?</text><text x="305" y="250" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#9ca3af">You control:</text><text x="305" y="276" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#e5e7eb">Accurate address or</text><text x="305" y="298" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#e5e7eb">service area</text>
  <rect x="530" y="85" width="225" height="230" rx="12" fill="#1f2937" stroke="#387cf9" stroke-width="2"/><text x="550" y="128" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#387cf9">Prominence</text><text x="550" y="165" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#e5e7eb">How known and trusted</text><text x="550" y="191" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#e5e7eb">is your business?</text><text x="550" y="250" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#9ca3af">You control:</text><text x="550" y="276" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#e5e7eb">Reviews, photos,</text><text x="550" y="298" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#e5e7eb">website, mentions</text>

</svg>
