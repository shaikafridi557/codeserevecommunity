<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="Relative cost by type of chatbot: FAQ website chatbot (Lowest), WhatsApp AI assistant (Medium), Booking / order chatbot (Medium to high), Internal knowledge assistant (Medium to high), Multi-channel AI agent (Highest)"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9ccd1"/></marker></defs><rect width="800" height="340" rx="12" fill="#191919"/><text x="400.0" y="42" fill="#e5e7eb" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Relative cost by type of chatbot</text><text x="30" y="102" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="600">FAQ website chatbot</text><rect x="300" y="84" width="420" height="26" rx="6" fill="#222831"/><rect x="300" y="84" width="84" height="26" rx="6" fill="#387cf9"/><text x="394" y="102" fill="#c9ccd1" font-family="Poppins, Arial, sans-serif" font-size="13" text-anchor="start">Lowest</text><text x="30" y="148" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="600">WhatsApp AI assistant</text><rect x="300" y="130" width="420" height="26" rx="6" fill="#222831"/><rect x="300" y="130" width="168" height="26" rx="6" fill="#387cf9"/><text x="478" y="148" fill="#c9ccd1" font-family="Poppins, Arial, sans-serif" font-size="13" text-anchor="start">Medium</text><text x="30" y="194" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="600">Booking / order chatbot</text><rect x="300" y="176" width="420" height="26" rx="6" fill="#222831"/><rect x="300" y="176" width="252" height="26" rx="6" fill="#387cf9"/><text x="562" y="194" fill="#c9ccd1" font-family="Poppins, Arial, sans-serif" font-size="13" text-anchor="start">Medium to high</text><text x="30" y="240" fill="#fff" font-family="Poppins, Arial, sans-serif"