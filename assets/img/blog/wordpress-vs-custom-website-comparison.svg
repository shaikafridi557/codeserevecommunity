<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 445" width="800" height="445">
  <rect width="800" height="445" rx="12" fill="#191919"/>
  <text x="40" y="52" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">WordPress vs custom website at a glance</text>
  <text x="430" y="100" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#e5e7eb">WordPress</text><text x="650" y="100" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#387cf9">Custom</text>
  <rect x="30" y="120" width="740" height="44" rx="8" fill="#1f2937"/><text x="50" y="148" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#e5e7eb">Upfront cost</text><text x="430" y="148" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#d1d5db">Lower</text><text x="650" y="148" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#d1d5db">Higher</text>
  <rect x="30" y="170" width="740" height="44" rx="8" fill="#202020"/><text x="50" y="198" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#e5e7eb">Time to launch</text><text x="430" y="198" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#d1d5db">Faster</text><text x="650" y="198" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#d1d5db">Slower</text>
  <rect x="30" y="220" width="740" height="44" rx="8" fill="#1f2937"/><text x="50" y="248" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#e5e7eb">Edit content yourself</text><text x="430" y="248" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#d1d5db">Easy (built in)</text><text x="650" y="248" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#d1d5db">Needs an admin panel</text>
  <rect x="30" y="270" width="740" height="44" rx="8" fill="#202020"/><text x="50" y="298" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#e5e7eb">Design &amp; feature freedom</text><text x="430" y="298" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#d1d5db">Good, plugin-limited</text><text x="650" y="298" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#d1d5db">Unlimited</text>
  <rect x="30" y="320" width="740" height="44" rx="8" fill="#1f2937"/><text x="50" y="348" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#e5e7eb">Speed potential</text><text x="430" y="348" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#d1d5db">Good with tuning</text><text x="650" y="348" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#d1d5db">Excellent</text>
  <rect x="30" y="370" width="740" height="44" rx="8" fill="#202020"/><text x="50" y="398" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#e5e7eb">Ongoing upkeep</text><text x="430" y="398" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#d1d5db">Plugin &amp; core updates</text><text x="650" y="398" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#d1d5db">Developer for changes</text>

</svg>
