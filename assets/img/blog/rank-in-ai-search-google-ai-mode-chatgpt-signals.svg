<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img" aria-label="What AI search uses to choose a business: Crawlable pages (indexed and readable), Consistent facts (same name, address, phone), Reviews (rating and review count), Mentions (directories and news), Clear content (answers with real facts), Structured data (machine-readable details)"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9ccd1"/></marker></defs><rect width="800" height="390" rx="12" fill="#191919"/><text x="400.0" y="42" fill="#e5e7eb" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">What AI search uses to choose a business</text><rect x="190" y="70" width="420" height="42" rx="9" fill="#1e3a8a"/><text x="400.0" y="97" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">Crawlable pages</tspan><tspan fill="#e8eefc">  ·  indexed and readable</tspan></text><rect x="158" y="120" width="484" height="42" rx="9" fill="#1e40af"/><text x="400.0" y="147" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">Consistent facts</tspan><tspan fill="#e8eefc">  ·  same name, address, phone</tspan></text><rect x="126" y="170" width="548" height="42" rx="9" fill="#1d4ed8"/><text x="400.0" y="197" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">Reviews</tspan><tspan fill="#e8eefc">  ·  rating and review count</tspan></text><rect x="94" y="220" width="612" height="42" rx="9" fill="#2052c8"/><text x="400.0" y="247" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">Mentions</tspan><tspan fill="#e8eefc">  ·  directories and news</tspan></text><rect x="62" y="270" width="676" height="42" rx="9" fill="#2459d8"/><text x="400.0" y="297" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">Clear content</tspan><tspan fill="#e8eefc">  ·  answers with real facts</tspan></text><rect x="30" y="320" width="740" height="42" rx="9" fill="#2a62e0"/><text x="400.0" y="347" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">Structured data</tspan><tspan fill="#e8eefc">  ·  machine-readable details</tspan></text></svg>
