<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" width="800" height="456" role="img" aria-label="Layers of website protection: HTTPS (encrypted, no browser warnings), Updates (CMS, theme and plugins), Strong logins (unique passwords + 2FA), Limited access (right role for each person), Backups (automatic, stored off the server), Firewall (blocks attacks and bad bots), Monitoring (uptime, malware, Search Console)"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9ccd1"/></marker></defs><rect width="800" height="456" rx="12" fill="#191919"/><text x="400.0" y="42" fill="#e5e7eb" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Layers of website protection</text><rect x="190" y="70" width="420" height="42" rx="9" fill="#1e3a8a"/><text x="400.0" y="97" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">HTTPS</tspan><tspan fill="#e8eefc">  ·  encrypted, no browser warnings</tspan></text><rect x="163" y="120" width="473" height="42" rx="9" fill="#1e40af"/><text x="400.0" y="147" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">Updates</tspan><tspan fill="#e8eefc">  ·  CMS, theme and plugins</tspan></text><rect x="137" y="170" width="527" height="42" rx="9" fill="#1d4ed8"/><text x="400.0" y="197" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">Strong logins</tspan><tspan fill="#e8eefc">  ·  unique passwords + 2FA</tspan></text><rect x="110" y="220" width="580" height="42" rx="9" fill="#2052c8"/><text x="400.0" y="247" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">Limited access</tspan><tspan fill="#e8eefc">  ·  right role for each person</tspan></text><rect x="83" y="270" width="633" height="42" rx="9" fill="#2459d8"/><text x="400.0" y="297" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">Backups</tspan><tspan fill="#e8eefc">  ·  automatic, stored off the server</tspan></text><rect x="57" y="320" width="687" height="42" rx="9" fill="#2a62e0"/><text x="400.0" y="347" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">Firewall</tspan><tspan fill="#e8eefc">  ·  blocks attacks and bad bots</tspan></text><rect x="30" y="370" width="740" height="42" rx="9" fill="#2f6be6"/><text x="400.0" y="397" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">Monitoring</tspan><tspan fill="#e8eefc">  ·  uptime, malware, Search Console</tspan></text><text x="400.0" y="442" fill="#c9ccd1" font-family="Poppins, Arial, sans-serif" font-size="13" text-anchor="middle">Security works in layers: if one fails, the next one still protects you.</text></svg>
