<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 306" width="800" height="306" role="img" aria-label="What the first screen of a homepage should show: Headline (what you do, for whom, where), One main button (Call, WhatsApp or Get a quote), Main services (three to six, each linked), Trust (reviews, photos, years in business)"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9ccd1"/></marker></defs><rect width="800" height="306" rx="12" fill="#191919"/><text x="400.0" y="42" fill="#e5e7eb" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">What the first screen of a homepage should show</text><rect x="190" y="70" width="420" height="42" rx="9" fill="#1e3a8a"/><text x="400.0" y="97" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">Headline</tspan><tspan fill="#e8eefc">  ·  what you do, for whom, where</tspan></text><rect x="137" y="120" width="527" height="42" rx="9" fill="#1e40af"/><text x="400.0" y="147" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">One main button</tspan><tspan fill="#e8eefc">  ·  Call, WhatsApp or Get a quote</tspan></text><rect x="83" y="170" width="633" height="42" rx="9" fill="#1d4ed8"/><text x="400.0" y="197" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">Main services</tspan><tspan fill="#e8eefc">  ·  three to six, each linked</tspan></text><rect x="30" y="220" width="740" height="42" rx="9" fill="#2052c8"/><text x="400.0" y="247" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">Trust</tspan><tspan fill="#e8eefc">  ·  reviews, photos, years in business</tspan></text><text x="400.0" y="292" fill="#c9ccd1" font-family="Poppins, Arial, sans-serif" font-size="13" text-anchor="middle">A visitor should understand all four within a few seconds on a phone.</text></svg>
