<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="Generative AI vs agentic AI. Generative AI: You give a prompt, It writes an answer or draft, You decide and do the next step, Best for content and Q&amp;A. Agentic AI: You give a goal, It plans the steps, It uses your tools to act, It asks you only for exceptions."><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9ccd1"/></marker></defs><rect width="800" height="320" rx="12" fill="#191919"/><text x="400.0" y="42" fill="#e5e7eb" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Generative AI vs agentic AI</text><rect x="30" y="70" width="360" height="226" rx="12" fill="#222831" stroke="#387cf9" stroke-width="2"/><rect x="30" y="70" width="360" height="44" rx="12" fill="#387cf9"/><rect x="30" y="100" width="360" height="14" fill="#387cf9"/><text x="210" y="99" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Generative AI</text><circle cx="54" cy="141" r="5" fill="#387cf9"/><text x="70" y="146" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="70" dy="0">You give a prompt</tspan></text><circle cx="54" cy="185" r="5" fill="#387cf9"/><text x="70" y="190" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="70" dy="0">It writes an answer or draft</tspan></text><circle cx="54" cy="229" r="5" fill="#387cf9"/><text x="70" y="234" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="70" dy="0">You decide and do the next step</tspan></text><circle cx="54" cy="273" r="5" fill="#387cf9"/><text x="70" y="278" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Best for content and Q&amp;A</tspan></text><rect x="410" y="70" width="360" height="226" rx="12" fill="#222831" stroke="#6b7280" stroke-width="2"/><rect x="410" y="70" width="360" height="44" rx="12" fill="#4b5563"/><rect x="410" y="100" width="360" height="14" fill="#4b5563"/><text x="590" y="99" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Agentic AI</text><circle cx="434" cy="141" r="5" fill="#c9ccd1"/><text x="450" y="146" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="450" dy="0">You give a goal</tspan></text><circle cx="434" cy="185" r="5" fill="#c9ccd1"/><text x="450" y="190" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="450" dy="0">It plans the steps</tspan></text><circle cx="434" cy="229" r="5" fill="#c9ccd1"/><text x="450" y="234" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="450" dy="0">It uses your tools to act</tspan></text><circle cx="434" cy="273" r="5" fill="#c9ccd1"/><text x="450" y="278" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="450" dy="0">It asks you only for exceptions</tspan></text></svg>
