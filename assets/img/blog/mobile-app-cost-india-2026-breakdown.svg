<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="12" fill="#191919"/>
  <text x="400" y="46" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Where a typical app budget goes</text>
  <text x="400" y="74" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#9ca3af">Illustrative split for a business app — every project differs</text>
  <g font-family="Poppins, Arial, sans-serif" font-size="18" fill="#e5e7eb">
    <text x="40" y="128">Planning &amp; UI/UX design</text><rect x="320" y="110" width="440" height="24" rx="6" fill="#2a2a2a"/><rect x="320" y="110" width="66" height="24" rx="6" fill="#387cf9"/><text x="396" y="128" fill="#9ca3af">~10–15%</text>
    <text x="40" y="178">App screens (frontend)</text><rect x="320" y="160" width="440" height="24" rx="6" fill="#2a2a2a"/><rect x="320" y="160" width="132" height="24" rx="6" fill="#387cf9"/><text x="462" y="178" fill="#9ca3af">~25–35%</text>
    <text x="40" y="228">Backend, database &amp; APIs</text><rect x="320" y="210" width="440" height="24" rx="6" fill="#2a2a2a"/><rect x="320" y="210" width="132" height="24" rx="6" fill="#387cf9"/><text x="462" y="228" fill="#9ca3af">~25–35%</text>
    <text x="40" y="278">Admin panel</text><rect x="320" y="260" width="440" height="24" rx="6" fill="#2a2a2a"/><rect x="320" y="260" width="66" height="24" rx="6" fill="#387cf9"/><text x="396" y="278" fill="#9ca3af">~10–15%</text>
    <text x="40" y="328">Testing &amp; store launch</text><rect x="320" y="310" width="440" height="24" rx="6" fill="#2a2a2a"/><rect x="320" y="310" width="66" height="24" rx="6" fill="#387cf9"/><text x="396" y="328" fill="#9ca3af">~10–15%</text>
  </g>
  <text x="400" y="378" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#9ca3af">Plus yearly running costs: servers, store fees, updates and support.</text>
</svg>
