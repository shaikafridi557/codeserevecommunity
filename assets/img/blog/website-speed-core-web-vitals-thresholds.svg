<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="Core Web Vitals thresholds for LCP, INP and CLS">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e5e7eb"/></marker></defs>
  <rect width="800" height="320" rx="12" fill="#191919"/>
  <text x="400" y="44" fill="#e5e7eb" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Core Web Vitals thresholds (75th percentile)</text>
  <text x="30" y="110" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700">LCP</text>
  <rect x="230" y="80" width="200" height="44" rx="8" fill="#387cf9"/>
  <rect x="430" y="80" width="160" height="44" fill="#6b7280"/>
  <rect x="590" y="80" width="180" height="44" rx="8" fill="#2a2a2a" stroke="#4b5563"/>
  <text x="330.0" y="109" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Good ≤ 2.5 s</text>
  <text x="510.0" y="109" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="17" text-anchor="middle">2.5–4 s</text>
  <text x="680.0" y="109" fill="#e5e7eb" font-family="Poppins, Arial, sans-serif" font-size="17" text-anchor="middle">Poor &gt; 4 s</text>
  <text x="30" y="180" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700">INP</text>
  <rect x="230" y="150" width="200" height="44" rx="8" fill="#387cf9"/>
  <rect x="430" y="150" width="160" height="44" fill="#6b7280"/>
  <rect x="590" y="150" width="180" height="44" rx="8" fill="#2a2a2a" stroke="#4b5563"/>
  <text x="330.0" y="179" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Good ≤ 200 ms</text>
  <text x="510.0" y="179" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="17" text-anchor="middle">200–500 ms</text>
  <text x="680.0" y="179" fill="#e5e7eb" font-family="Poppins, Arial, sans-serif" font-size="17" text-anchor="middle">Poor &gt; 500 ms</text>
  <text x="30" y="250" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700">CLS</text>
  <rect x="230" y="220" width="200" height="44" rx="8" fill="#387cf9"/>
  <rect x="430" y="220" width="160" height="44" fill="#6b7280"/>
  <rect x="590" y="220" width="180" height="44" rx="8" fill="#2a2a2a" stroke="#4b5563"/>
  <text x="330.0" y="249" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Good ≤ 0.1</text>
  <text x="510.0" y="249" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="17" text-anchor="middle">0.1–0.25</text>
  <text x="680.0" y="249" fill="#e5e7eb" font-family="Poppins, Arial, sans-serif" font-size="17" text-anchor="middle">Poor &gt; 0.25</text>
  <text x="230" y="300" fill="#9ca3af" font-family="Poppins, Arial, sans-serif" font-size="15">Good</text><text x="430" y="300" fill="#9ca3af" font-family="Poppins, Arial, sans-serif" font-size="15">Needs improvement</text><text x="590" y="300" fill="#9ca3af" font-family="Poppins, Arial, sans-serif" font-size="15">Poor</text>
</svg>
