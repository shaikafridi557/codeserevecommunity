<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-label="Example follow-up timeline: 0 min: Instant acknowledgement; 30 min: Reminder to the salesperson; 2 hours: Manager alerted if still new; Day 2: Polite follow-up after a quote; Won: Thank-you and review request"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9ccd1"/></marker></defs><rect width="800" height="250" rx="12" fill="#191919"/><text x="400.0" y="42" fill="#e5e7eb" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Example follow-up timeline</text><path d="M110 120 H690" stroke="#3a3f47" stroke-width="4"/><circle cx="110" cy="120" r="12" fill="#387cf9" stroke="#191919" stroke-width="3"/><text x="110" y="95" fill="#387cf9" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">0 min</text><text x="110.0" y="158" fill="#c9ccd1" font-family="Poppins, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle"><tspan x="110.0" dy="0">Instant</tspan><tspan x="110.0" dy="17">acknowledgement</tspan></text><circle cx="255" cy="120" r="12" fill="#387cf9" stroke="#191919" stroke-width="3"/><text x="255" y="95" fill="#387cf9" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">30 min</text><text x="255.0" y="158" fill="#c9ccd1" font-family="Poppins, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle"><tspan x="255.0" dy="0">Reminder to the</tspan><tspan x="255.0" dy="17">salesperson</tspan></text><circle cx="400" cy="120" r="12" fill="#387cf9" stroke="#191919" stroke-width="3"/><text x="400" y="95" fill="#387cf9" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2 hours</text><text x="400.0" y="158" fill="#c9ccd1" font-family="Poppins, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle"><tspan x="400.0" dy="0">Manager alerted if</tspan><tspan x="400.0" dy="17">still new</tspan></text><circle cx="545" cy="120" r="12" fill="#387cf9" stroke="#191919" stroke-width="3"/><text x="545" y="95" fill="#387cf9" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Day 2</text><text x="545.0" y="158" fill="#c9ccd1" font-family="Poppins, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle"><tspan x="545.0" dy="0">Polite follow-up</tspan><tspan x="545.0" dy="17">after a quote</tspan></text><circle cx="690" cy="120" r="12" fill="#387cf9" stroke="#191919" stroke-width="3"/><text x="690" y="95" fill="#387cf9" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Won</text><text x="690.0" y="158" fill="#c9ccd1" font-family="Poppins, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle"><tspan x="690.0" dy="0">Thank-you and review</tspan><tspan x="690.0" dy="17">request</tspan></text></svg>
