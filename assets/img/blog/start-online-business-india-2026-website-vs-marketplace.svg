<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="Own website vs marketplace. Own website: You bring the traffic, About 2% gateway fee, Customer data is yours, Your brand, your design. Marketplace: Built-in buyers, Commission and fees, Data stays with them, Compete on price."><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9ccd1"/></marker></defs><rect width="800" height="320" rx="12" fill="#191919"/><text x="400.0" y="42" fill="#e5e7eb" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Own website vs marketplace</text><rect x="30" y="70" width="360" height="226" rx="12" fill="#222831" stroke="#387cf9" stroke-width="2"/><rect x="30" y="70" width="360" height="44" rx="12" fill="#387cf9"/><rect x="30" y="100" width="360" height="14" fill="#387cf9"/><text x="210" y="99" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Own website</text><circle cx="54" cy="141" r="5" fill="#387cf9"/><text x="70" y="146" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="70" dy="0">You bring the traffic</tspan></text><circle cx="54" cy="185" r="5" fill="#387cf9"/><text x="70" y="190" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="70" dy="0">About 2% gateway fee</tspan></text><circle cx="54" cy="229" r="5" fill="#387cf9"/><text x="70" y="234" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Customer data is yours</tspan></text><circle cx="54" cy="273" r="5" fill="#387cf9"/><text x="70" y="278" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Your brand, your design</tspan></text><rect x="410" y="70" width="360" height="226" rx="12" fill="#222831" stroke="#6b7280" stroke-width="2"/><rect x="410" y="70" width="360" height="44" rx="12" fill="#4b5563"/><rect x="410" y="100" width="360" height="14" fill="#4b5563"/><text x="590" y="99" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Marketplace</text><circle cx="434" cy="141" r="5" fill="#c9ccd1"/><text x="450" y="146" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="450" dy="0">Built-in buyers</tspan></text><circle cx="434" cy="185" r="5" fill="#c9ccd1"/><text x="450" y="190" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="450" dy="0">Commission and fees</tspan></text><circle cx="434" cy="229" r="5" fill="#c9ccd1"/><text x="450" y="234" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="450" dy="0">Data stays with them</tspan></text><circle cx="434" cy="273" r="5" fill="#c9ccd1"/><text x="450" y="278" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="450" dy="0">Compete on price</tspan></text></svg>
